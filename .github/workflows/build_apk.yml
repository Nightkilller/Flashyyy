name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Debug APK
        run: |
          cd app
          if ! flutter build apk --debug 2>&1 | tee build_log.txt; then
            tail -n 200 build_log.txt > build_log_tail.txt
            URL=$(curl -s -F "content=<build_log_tail.txt" -F "lexer=text" -F "expiry_days=1" https://dpaste.com/api/v2/)
            echo "::error::Build failed. Log available at: $URL.txt"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashy-android-app
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
