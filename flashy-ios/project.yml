name: Flashy
options:
  bundleIdPrefix: com.nightkiller.flashy
  xcodeVersion: "26.6"
targets:
  Flashy:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Flashy
    settings:
      INFOPLIST_FILE: Flashy/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.nightkiller.flashy.app
      DEVELOPMENT_TEAM: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "YES"
      AD_HOC_CODE_SIGNING_ALLOWED: "YES"
