# Flashy — coturn TURN Relay Server Configuration
# Phase 5: Deploy this on your Oracle Cloud VM.
#
# IMPORTANT: This relay NEVER writes file bytes to disk.
# It only relays encrypted (DTLS) WebRTC data between devices
# when direct P2P fails.

# Network
listening-port=3478
tls-listening-port=5349

# Realm — use your actual domain
realm=flashy.app

# Credentials (change these!)
user=flashy:change_this_password_in_production

# Relay port range
min-port=49152
max-port=65535

# Logging — connection metadata only, never file content
log-file=/var/log/coturn/turnserver.log
simple-log
# Do NOT enable verbose logging in production — it could leak metadata

# Security
no-multicast-peers
no-cli
fingerprint
lt-cred-mech

# TLS (get certs from Let's Encrypt)
# cert=/etc/letsencrypt/live/your-domain/fullchain.pem
# pkey=/etc/letsencrypt/live/your-domain/privkey.pem

# Disable TCP relay to reduce attack surface (UDP is sufficient for WebRTC)
no-tcp-relay

# Deny traffic to private IP ranges (prevent relay abuse for internal scanning)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
